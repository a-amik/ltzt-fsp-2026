    <!-- Знак в движении: прелоадер и ожидание данных. Круг 3 с: блоки сходятся, разряд бежит по знаку, блоки расходятся.
         В покое и при «уменьшении движения» знак стоит собранным. Знак один для обеих версий — в цветах флага. -->
    <style>
      .sg { --sg-a: #0039A6; --sg-af: #7FA6FF; --sg-l: #D52B1E; --sg-lf: #FF9A90; --sg-h: #FFFFFF; overflow: visible; display: block; }
      .sg rect { animation-duration: 3s; animation-iteration-count: infinite; animation-timing-function: cubic-bezier(.45, 0, .55, 1); }
      .sg-a, .sg-b { fill: var(--sg-a); } .sg-l { fill: var(--sg-l); } .sg-h { fill: var(--sg-h); transform-box: fill-box; transform-origin: center; }
      .sg-a { animation-name: sg-a, sg-fa; } .sg-b { animation-name: sg-b, sg-fa; animation-delay: 0s, .2s; } .sg-l { animation-name: sg-l, sg-fl; animation-delay: 0s, .4s; } .sg-h { animation-name: sg-h; }
      @keyframes sg-a { 0%, 100% { transform: translate(-24px, -16px); } 32%, 66% { transform: none; } }
      @keyframes sg-b { 0%, 100% { transform: translate(24px, 14px); } 32%, 66% { transform: none; } }
      @keyframes sg-l { 0%, 100% { transform: translate(-8px, 22px); } 32%, 66% { transform: none; } }
      @keyframes sg-h { 0%, 27%, 71%, 100% { transform: scale(0); } 36%, 62% { transform: none; } }
      @keyframes sg-fa { 0%, 36%, 54%, 100% { fill: var(--sg-a); } 45% { fill: var(--sg-af); } }
      @keyframes sg-fl { 0%, 36%, 54%, 100% { fill: var(--sg-l); } 45% { fill: var(--sg-lf); } }
      @media (prefers-reduced-motion: reduce) { .sg rect { animation: none; } }
      #boot { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #EDEDED; transition: opacity .3s ease; }
      #boot.is-dark { background: #1B1C21; } #boot.is-rz { background: #FFD400; } #boot.is-done { opacity: 0; pointer-events: none; }
      #boot .sg { width: 76px; height: auto; }
      .sg-wait { display: grid; place-items: center; min-height: 50vh; } .sg-wait .sg { width: 56px; height: auto; }
      .sg-wait--sm { min-height: 120px; } .sg-wait--sm .sg { width: 32px; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Tektur:wght@700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="boot" role="status" aria-label="Загружаем"><svg class="sg" viewBox="-30 -24 182 192" aria-hidden="true"><rect class="sg-a" width="82" height="60" /><rect class="sg-b" x="40" y="30" width="82" height="60" /><rect class="sg-h" x="40" y="30" width="42" height="30" /><rect class="sg-l" y="90" width="40" height="54" /></svg></div>
    <script>
      // Вид прелоадера до загрузки приложения: та же логика, что у приложения (сторона, кабинет, тема).
      (function () { var b = document.getElementById('boot'), u = {}; try { u = JSON.parse(localStorage.getItem('razryad-ui-v2')) || {}; } catch (e) {}
        var h = location.hash, cand = h === '#candidates' || (h !== '#business' && (u.role === 'cand' || (u.role === 'home' && u.lside === 'cand')));
        var skin = u.skinPicked ? u.skin : (cand ? 'razryad' : 'fsp'), dark = u.theme === 'dark' || ((!u.theme || u.theme === 'auto') && matchMedia('(prefers-color-scheme: dark)').matches);
        if (skin === 'razryad') b.className = 'is-rz'; else if (dark) b.className = 'is-dark'; })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
