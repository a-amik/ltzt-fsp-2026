    <rect x="342" y="216" width="88" height="8" rx="3" fill="var(--r-blue, #402FFF)" stroke="none"/>
    <rect x="516" y="208" width="56" height="24" rx="12" fill="var(--r-blue, #402FFF)" stroke="none"/>
