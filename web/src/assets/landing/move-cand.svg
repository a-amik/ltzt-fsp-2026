    <rect x="128" y="294" width="80" height="6" rx="3" fill="var(--r-hair, rgba(27,28,33,.14))" stroke="none"/>
    <rect x="254" y="304" width="40" height="8" rx="3" fill="var(--r-hair, rgba(27,28,33,.14))" stroke="none"/>
