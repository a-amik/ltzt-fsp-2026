    <rect x="342" y="172" width="124" height="8" rx="3" fill="var(--r-hair, rgba(27,28,33,.14))" stroke="none"/>
    <rect x="342" y="216" width="144" height="8" rx="3" fill="var(--r-hair, rgba(27,28,33,.14))" stroke="none"/>
    <rect x="342" y="260" width="136" height="8" rx="3" fill="var(--r-hair, rgba(27,28,33,.14))" stroke="none"/>
    <rect x="342" y="304" width="156" height="8" rx="3" fill="var(--r-hair, rgba(27,28,33,.14))" stroke="none"/>
  </g>

