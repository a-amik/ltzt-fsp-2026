    <rect x="128" y="118" width="88" height="6" rx="3" fill="var(--r-hair, rgba(27,28,33,.14))" stroke="none"/>
    <rect x="254" y="128" width="40" height="8" rx="3" fill="var(--r-hair, rgba(27,28,33,.14))" stroke="none"/>
  </g>

