  <g class="mc-a mc-row mc-row-resume">
    <rect x="342" y="128" width="156" height="8" rx="3" fill="var(--r-paper, #FFFFFF)" stroke="none"/>
    <rect x="342" y="128" width="100" height="8" rx="3" fill="var(--r-sun, #DAD6FF)" stroke="none"/>
    <rect x="516" y="120" width="56" height="24" rx="12" fill="none"/>
