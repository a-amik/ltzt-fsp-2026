  </g>
  <g class="mc-a mc-packet mc-packet-fsp-two">
    <rect x="294" y="216" width="40" height="8" rx="3" fill="var(--r-blue, #402FFF)" stroke="none"/>
  </g>
  <g class="mc-a mc-packet mc-packet-repository">
    <rect x="254" y="304" width="40" height="8" rx="3" fill="var(--r-sun, #DAD6FF)" stroke="none"/>
  </g>
  <g class="mc-a mc-packet mc-packet-repository-two">
    <rect x="294" y="304" width="40" height="8" rx="3" fill="var(--r-sun, #DAD6FF)" stroke="none"/>
