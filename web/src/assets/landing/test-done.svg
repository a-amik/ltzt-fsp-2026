<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" fill="none" stroke="var(--r-ink, #1B1C21)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
  <style>
    .td-a { animation-duration: 7.2s; animation-timing-function: ease-in-out; animation-iteration-count: infinite; }
    .td-attention { opacity: 1; }
    .td-attention-west { animation-name: td-seen-west; }
    .td-attention-north { animation-name: td-seen-north; }
    .td-attention-east { animation-name: td-seen-east; }
    .td-flight { opacity: 0; transform: translateY(0px); }
    .td-flight-one { animation-name: td-arrive-one; }
    .td-flight-two { animation-name: td-arrive-two; }
    .td-delivered { opacity: 1; animation-name: td-settle; }
    @keyframes td-seen-west {
      0%, 8%, 96%, 100% { opacity: 0; }
      16%, 88% { opacity: 1; }
    }
    @keyframes td-seen-north {
      0%, 20%, 96%, 100% { opacity: 0; }
      28%, 88% { opacity: 1; }
    }
    @keyframes td-seen-east {
      0%, 32%, 96%, 100% { opacity: 0; }
      40%, 88% { opacity: 1; }
    }
    @keyframes td-arrive-one {
      0%, 42%, 100% { opacity: 0; transform: translateY(0px); }
      46% { opacity: 1; transform: translateY(0px); }
      58% { opacity: 1; transform: translateY(40px); }
      62%, 96% { opacity: 0; transform: translateY(40px); }
    }
    @keyframes td-arrive-two {
      0%, 58%, 100% { opacity: 0; transform: translateY(0px); }
      62% { opacity: 1; transform: translateY(0px); }
      74% { opacity: 1; transform: translateY(40px); }
      78%, 96% { opacity: 0; transform: translateY(40px); }
    }
    @keyframes td-settle {
      0%, 74%, 96%, 100% { opacity: 0; }
      78%, 88% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .td-a { animation: none; }
      .td-attention { opacity: 1; }
      .td-delivered { opacity: 1; transform: none; }
      .td-flight { opacity: 0; transform: none; }
    }
  </style>

  <path d="M192 108H206Q218 108 218 120V156M320 84V156M448 108H434Q422 108 422 120V156" stroke="var(--r-hair, rgba(27,28,33,.14))"/>

  <g class="td-company-west">
    <rect x="80" y="76" width="112" height="64" rx="12" fill="var(--r-paper, #FFFFFF)"/>
    <rect x="96" y="92" width="32" height="32" rx="6" fill="var(--r-sun, #DAD6FF)" stroke="none"/>
    <rect x="102" y="98" width="6" height="6" fill="var(--r-blue, #402FFF)" stroke="none"/>
    <rect x="116" y="98" width="6" height="6" fill="var(--r-blue, #402FFF)" stroke="none"/>
    <rect x="102" y="110" width="6" height="6" fill="var(--r-blue, #402FFF)" stroke="none"/>
    <rect x="116" y="110" width="6" height="6" fill="var(--r-blue, #402FFF)" stroke="none"/>
    <path d="M108 124V116H116V124"/>
    <rect x="142" y="96" width="34" height="8" rx="3" fill="var(--r-sun, #DAD6FF)" stroke="none"/>
    <rect x="142" y="114" width="24" height="6" rx="3" fill="var(--r-hair, rgba(27,28,33,.14))" stroke="none"/>
    <circle class="td-a td-attention td-attention-west" cx="180" cy="88" r="4" fill="var(--r-blue, #402FFF)" stroke="none"/>
  </g>

  <g class="td-company-north">
    <rect x="264" y="20" width="112" height="64" rx="12" fill="var(--r-paper, #FFFFFF)"/>
    <rect x="280" y="36" width="32" height="32" rx="6" fill="var(--r-sun, #DAD6FF)" stroke="none"/>
    <rect x="286" y="42" width="6" height="6" fill="var(--r-blue, #402FFF)" stroke="none"/>
    <rect x="300" y="42" width="6" height="6" fill="var(--r-blue, #402FFF)" stroke="none"/>
    <rect x="286" y="54" width="6" height="6" fill="var(--r-blue, #402FFF)" stroke="none"/>
    <rect x="300" y="54" width="6" height="6" fill="var(--r-blue, #402FFF)" stroke="none"/>
    <path d="M292 68V60H300V68"/>
    <rect x="326" y="40" width="34" height="8" rx="3" fill="var(--r-sun, #DAD6FF)" stroke="none"/>
    <rect x="326" y="58" width="24" height="6" rx="3" fill="var(--r-hair, rgba(27,28,33,.14))" stroke="none"/>
    <circle class="td-a td-attention td-attention-north" cx="364" cy="32" r="4" fill="var(--r-blue, #402FFF)" stroke="none"/>
  </g>

  <g class="td-company-east">
    <rect x="448" y="76" width="112" height="64" rx="12" fill="var(--r-paper, #FFFFFF)"/>
    <rect x="464" y="92" width="32" height="32" rx="6" fill="var(--r-sun, #DAD6FF)" stroke="none"/>
    <rect x="470" y="98" width="6" height="6" fill="var(--r-blue, #402FFF)" stroke="none"/>
    <rect x="484" y="98" width="6" height="6" fill="var(--r-blue, #402FFF)" stroke="none"/>
    <rect x="470" y="110" width="6" height="6" fill="var(--r-blue, #402FFF)" stroke="none"/>
    <rect x="484" y="110" width="6" height="6" fill="var(--r-blue, #402FFF)" stroke="none"/>
    <path d="M476 124V116H484V124"/>
    <rect x="510" y="96" width="34" height="8" rx="3" fill="var(--r-sun, #DAD6FF)" stroke="none"/>
    <rect x="510" y="114" width="24" height="6" rx="3" fill="var(--r-hair, rgba(27,28,33,.14))" stroke="none"/>
    <circle class="td-a td-attention td-attention-east" cx="548" cy="88" r="4" fill="var(--r-blue, #402FFF)" stroke="none"/>
  </g>

  <g class="td-category">
    <rect x="218" y="156" width="204" height="88" rx="12" fill="var(--r-blue, #402FFF)" stroke="none"/>
    <rect x="238" y="176" width="40" height="40" rx="6" fill="var(--r-sun, #DAD6FF)" stroke="none"/>
    <path d="M253 187L246 196L253 205M263 187L270 196L263 205" stroke="var(--r-blue, #402FFF)"/>
    <rect x="294" y="178" width="104" height="8" rx="3" fill="var(--r-paper, #FFFFFF)" stroke="none"/>
    <rect x="294" y="198" width="72" height="6" rx="3" fill="var(--r-sun, #DAD6FF)" stroke="none"/>
    <rect x="294" y="216" width="44" height="6" rx="3" fill="var(--r-sun, #DAD6FF)" stroke="none"/>
    <rect x="234" y="264" width="28" height="16" rx="6" fill="var(--r-sun, #DAD6FF)" stroke="none"/>
    <rect x="270" y="264" width="28" height="16" rx="6" fill="var(--r-sun, #DAD6FF)" stroke="none"/>
    <rect x="306" y="264" width="28" height="16" rx="6" fill="var(--r-blue, #402FFF)" stroke="none"/>
    <rect x="342" y="264" width="28" height="16" rx="6" fill="var(--r-sun, #DAD6FF)" stroke="none"/>
    <rect x="378" y="264" width="28" height="16" rx="6" fill="var(--r-sun, #DAD6FF)" stroke="none"/>
    <path d="M312 271L317 276L327 267" stroke="var(--r-paper, #FFFFFF)"/>
  </g>

  <rect class="td-tray-back" x="428" y="276" width="174" height="58" rx="12" fill="var(--r-paper, #FFFFFF)"/>

  <g class="td-a td-flight td-flight-one">
    <rect x="448" y="154" width="132" height="86" rx="12" fill="var(--r-paper, #FFFFFF)"/>
    <rect x="464" y="170" width="74" height="8" rx="3" fill="var(--r-sun, #DAD6FF)" stroke="none"/>
    <rect x="464" y="188" width="52" height="6" rx="3" fill="var(--r-hair, rgba(27,28,33,.14))" stroke="none"/>
    <path d="M464 218H564" stroke="var(--r-hair, rgba(27,28,33,.14))"/>
    <rect x="480" y="214" width="62" height="8" rx="3" fill="var(--r-blue, #402FFF)" stroke="none"/>
    <path d="M480 206V230M542 206V230" stroke="var(--r-blue, #402FFF)"/>
  </g>
  <g class="td-a td-flight td-flight-two">
    <rect x="448" y="194" width="132" height="86" rx="12" fill="var(--r-paper, #FFFFFF)"/>
    <rect x="464" y="210" width="74" height="8" rx="3" fill="var(--r-sun, #DAD6FF)" stroke="none"/>
    <rect x="464" y="228" width="52" height="6" rx="3" fill="var(--r-hair, rgba(27,28,33,.14))" stroke="none"/>
    <path d="M464 258H564" stroke="var(--r-hair, rgba(27,28,33,.14))"/>
    <rect x="480" y="254" width="62" height="8" rx="3" fill="var(--r-blue, #402FFF)" stroke="none"/>
    <path d="M480 246V270M542 246V270" stroke="var(--r-blue, #402FFF)"/>
  </g>
  <g class="td-a td-delivered">
    <rect x="448" y="234" width="132" height="86" rx="12" fill="var(--r-paper, #FFFFFF)"/>
    <rect x="464" y="250" width="74" height="8" rx="3" fill="var(--r-sun, #DAD6FF)" stroke="none"/>
    <rect x="464" y="268" width="52" height="6" rx="3" fill="var(--r-hair, rgba(27,28,33,.14))" stroke="none"/>
    <path d="M464 298H564" stroke="var(--r-hair, rgba(27,28,33,.14))"/>
    <rect x="480" y="294" width="62" height="8" rx="3" fill="var(--r-blue, #402FFF)" stroke="none"/>
    <path d="M480 286V310M542 286V310" stroke="var(--r-blue, #402FFF)"/>
  </g>

  <path class="td-tray-front" d="M428 304H476L486 314H544L554 304H602V322Q602 334 590 334H440Q428 334 428 322Z" fill="var(--r-sun, #DAD6FF)"/>
</svg>
