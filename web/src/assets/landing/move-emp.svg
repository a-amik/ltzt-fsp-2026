<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" fill="none" stroke="var(--r-ink, #1B1C21)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
  <style>
    .me-a { animation-duration: 7.2s; animation-timing-function: ease-in-out; animation-iteration-count: infinite; }
    .me-scan { opacity: 0; transform: translateY(0px); }
    .me-scan-one { animation-name: me-pass-one; }
    .me-scan-two { animation-name: me-pass-two; }
    .me-scan-three { animation-name: me-pass-three; }
    .me-scan-four { animation-name: me-pass-four; }
    .me-scan-five { animation-name: me-pass-five; }
    .me-scan-six { animation-name: me-pass-six; }
    .me-field { opacity: 1; }
    .me-specialization { animation-name: me-fill-specialization; }
    .me-grade { animation-name: me-fill-grade; }
    .me-stack { animation-name: me-fill-stack; }
    .me-range { animation-name: me-fill-range; }
    @keyframes me-pass-one {
      0%, 10%, 100% { opacity: 0; transform: translateY(0px); }
      12% { opacity: 1; transform: translateY(0px); }
      22% { opacity: 1; transform: translateY(32px); }
      24%, 96% { opacity: 0; transform: translateY(32px); }
    }
    @keyframes me-pass-two {
      0%, 22%, 100% { opacity: 0; transform: translateY(0px); }
      24% { opacity: 1; transform: translateY(0px); }
      34% { opacity: 1; transform: translateY(32px); }
      36%, 96% { opacity: 0; transform: translateY(32px); }
    }
    @keyframes me-pass-three {
      0%, 34%, 100% { opacity: 0; transform: translateY(0px); }
      36% { opacity: 1; transform: translateY(0px); }
      46% { opacity: 1; transform: translateY(32px); }
      48%, 96% { opacity: 0; transform: translateY(32px); }
    }
    @keyframes me-pass-four {
      0%, 46%, 100% { opacity: 0; transform: translateY(0px); }
      48% { opacity: 1; transform: translateY(0px); }
      58% { opacity: 1; transform: translateY(32px); }
      60%, 96% { opacity: 0; transform: translateY(32px); }
    }
    @keyframes me-pass-five {
      0%, 58%, 100% { opacity: 0; transform: translateY(0px); }
      60% { opacity: 1; transform: translateY(0px); }
      70% { opacity: 1; transform: translateY(32px); }
      72%, 96% { opacity: 0; transform: translateY(32px); }
    }
    @keyframes me-pass-six {
      0%, 70%, 100% { opacity: 0; transform: translateY(0px); }
      72% { opacity: 1; transform: translateY(0px); }
      82% { opacity: 1; transform: translateY(32px); }
      84%, 96% { opacity: 0; transform: translateY(32px); }
    }
    @keyframes me-fill-specialization {
      0%, 26%, 96%, 100% { opacity: 0; }
      34%, 88% { opacity: 1; }
    }
    @keyframes me-fill-grade {
      0%, 38%, 96%, 100% { opacity: 0; }
      46%, 88% { opacity: 1; }
    }
    @keyframes me-fill-stack {
      0%, 62%, 96%, 100% { opacity: 0; }
      70%, 88% { opacity: 1; }
    }
    @keyframes me-fill-range {
      0%, 74%, 96%, 100% { opacity: 0; }
      82%, 88% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .me-a { animation: none; }
      .me-field { opacity: 1; }
      .me-scan { opacity: 0; transform: none; }
    }
  </style>

